version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: propiq-backend
    ports:
      - "8000:8000"
    environment:
      - DEBUG=false
    volumes:
      # Persist trained model — don't retrain on every restart
      - propiq_models:/app/data/models
      - propiq_data:/app/data/processed
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: propiq-frontend
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  propiq_models:
  propiq_data: